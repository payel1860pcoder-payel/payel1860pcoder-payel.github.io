<!DOCTYPE html>
<html>
<head>
  <title>Saswati portfolio </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      margin: 20px auto;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h1 {
      color: #e91e63;
      font-size: 28px;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
      color: #333;
    }
    .heart {
      font-size: 50px;
      animation: beat 1s infinite;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">❤️</div>
    <h1>Hi,I'm Saswati </h1>
    <p>
        Welcome to my website. I'm a developer.<br>
     <br><br>
     
    </p>
    <p><b>-Saswati </b></p>
  </div>
</body>
</html>
